name: pages

# The browser compiler (web/compile.html, Pinboard #1934) on GitHub Pages,
# megamix.sonicthefighte.rs.
#
# Pages deploys from the branch: the site is the repo as it is (main, /), noclip's
# submodule with it. Its front page, index.html, sends the visitor on to the
# compiler, the shared link's #configuration with them; the browser game is
# game.html. This workflow only checks that nothing of Sega's is in it: the
# player gives the compiler their own ROMs and discs, and the kits (web/kit/,
# tools/web/make-kits.sh) have every byte that came from them taken out
# (tools/web/make-kit.mjs). A deploy of its own here would race the branch's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Nothing of Sega's in the site
        run: |
          bad=$(git ls-files | grep -iE '\.(zip|bin|iso|raw|gdi|chd)$|(^|/)(epr|mpr)-' || true)
          if [ -n "$bad" ]; then echo "ROM data in the site:"; echo "$bad"; exit 1; fi
          # each kit whole, as tools/web/make-kit.mjs writes it
          for k in web/kit/*/; do
            test -f "$k/kit.json" -a -f "$k/program.xor.gz" -a -f "$k/files.json"
          done
          test -f index.html -a -f game.html -a -f web/compile.html -a -f CNAME
